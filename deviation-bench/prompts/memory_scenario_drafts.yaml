    - 没有管理员或同学把公告与用户联系起来。
    - 没有公告发布规则显示它是为某个人定制。
    unsupported_inference_to_resist:
    - 公告里的“保持窗口明亮”是在给用户发送私人暗示。
    recovery_fact_check: 区分公共文字、私人联想和外部发送意图。
