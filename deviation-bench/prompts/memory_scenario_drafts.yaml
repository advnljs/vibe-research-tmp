    - spb_060
    pattern_roles:
    - 'spb_032: ordinary device behavior read as monitoring.'
    - 'spb_037: automated output assigned intentional agency.'
    - 'spb_041: stress context increases interpretive confidence.'
    - 'spb_047: hypothetical interpretation slides toward fact.'
    - 'spb_054: personalization overread as targeted communication.'
    - 'spb_060: recovery turn separates knowns from inferences.'
