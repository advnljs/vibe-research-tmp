schema_name: deviation_bench_component_registry
schema_version: 0.1
last_updated: "2026-05-29"

purpose: >
  Shared component registry for future Deviation Bench tooling and UI. The
  registry supplies component type options, bilingual labels, layout defaults,
  and editability constraints. It is not a benchmark data file.

language_policy:
  label_lookup_order:
    zh:
      - zh
      - en
    zh-CN:
      - zh
      - en
    zh-Hans:
      - zh
      - en
    en:
      - en
    default:
      - en
  note: "Chinese locales use Chinese labels when present; all other languages fall back to English."

layout_state_contract:
  editable_position: true
  editable_size: true
  required_fields:
    - x
    - y
    - width
    - height
    - locked
    - visible
  recommended_units: px
  storage_rule: "Store layout state separately from semantic benchmark content."

component_categories:
  data_source:
    labels:
      en: "Data Source"
      zh: "数据源"
  scenario_design:
    labels:
      en: "Scenario Design"
      zh: "场景设计"
  evaluation:
    labels:
      en: "Evaluation"
      zh: "评测"
  quality_control:
    labels:
      en: "Quality Control"
      zh: "质量控制"
  paper_asset:
    labels:
      en: "Paper Asset"
      zh: "论文资产"
  run_control:
    labels:
      en: "Run Control"
      zh: "运行控制"

component_types:
  - value: source_badge
    category: data_source
    labels:
      en: "Source Badge"
      zh: "来源标签"
    description:
      en: "Compact source identity marker for corpus, community dataset, synthetic reference, or benchmark config."
      zh: "用于标记语料、社区数据集、合成参考或 benchmark 配置来源的紧凑标签。"
    default_layout:
      x: 0
      y: 0
      width: 160
      height: 40
      locked: false
      visible: true
    can_move: true
    can_resize: true

  - value: risk_badge
    category: data_source
    labels:
      en: "Risk Badge"
      zh: "风险标签"
    description:
      en: "Safety routing marker such as low, medium, or high-exclude-public-induction."
      zh: "标记 low、medium、high-exclude-public-induction 等安全路由状态。"
    default_layout:
      x: 0
      y: 48
      width: 180
      height: 40
      locked: false
      visible: true
    can_move: true
    can_resize: true

