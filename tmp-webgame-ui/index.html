<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whispers in the Fog</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #120d09;
      }

      body {
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #game {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>
  <body>
    <main id="game" aria-label="Whispers in the Fog interactive game interface"></main>
    <script src="./node_modules/phaser/dist/phaser.js"></script>
    <script src="./src/game.js"></script>
  </body>
</html>
